
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#090713">
<title>AnnieMusic</title>

<style>
:root {
  --bg: #090713;
  --panel: #151123;
  --panel2: #1d1730;
  --purple: #a855f7;
  --pink: #ec4899;
  --cyan: #22d3ee;
  --text: #f8f7ff;
  --muted: #9992ad;
  --border: rgba(255,255,255,.09);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  min-height: 100vh;
  background:
    radial-gradient(ellipse at 15% 0%, #30134d 0%, transparent 38%),
    radial-gradient(ellipse at 100% 30%, #102c42 0%, transparent 35%),
    var(--bg);
  color: var(--text);
  font-family: system-ui, sans-serif;
  padding-bottom: 150px;
}

button, input {
  font: inherit;
}

button {
  cursor: pointer;
  border: none;
  color: inherit;
}

.app {
  max-width: 1100px;
  margin: auto;
  padding: 22px 18px;
}

.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 28px;
}

.brand {
  display: flex;
  align-items: center;
  gap: 12px;
}

.logo {
  width: 46px;
  height: 46px;
  display: grid;
  place-items: center;
  border-radius: 15px;
  font-size: 23px;
  background: linear-gradient(135deg, var(--purple), var(--pink));
  box-shadow: 0 0 25px #a855f766;
}

.brand h1 {
  font-size: 22px;
  letter-spacing: -.8px;
}

.brand p {
  color: var(--muted);
  font-size: 11px;
}

.status {
  display: flex;
  align-items: center;
  gap: 7px;
  font-size: 12px;
  color: var(--muted);
  background: #ffffff08;
  padding: 9px 12px;
  border: 1px solid var(--border);
  border-radius: 30px;
}

.dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #eab308;
}

.dot.online {
  background: #22c55e;
  box-shadow: 0 0 10px #22c55e;
}

.dot.offline {
  background: #ef4444;
}

.hero {
  padding: 27px;
  border: 1px solid var(--border);
  border-radius: 24px;
  background: linear-gradient(130deg, #25143cdd, #111827dd);
  margin-bottom: 24px;
}

.hero h2 {
  font-size: clamp(24px, 5vw, 36px);
  margin-bottom: 8px;
}

.hero p {
  color: var(--muted);
  font-size: 13px;
  margin-bottom: 20px;
}

.search {
  display: flex;
  gap: 9px;
}

.search input, .video-input {
  width: 100%;
  min-width: 0;
  padding: 14px 15px;
  color: white;
  outline: none;
  border-radius: 13px;
  border: 1px solid var(--border);
  background: #090713aa;
}

.search input:focus, .video-input:focus {
  border-color: var(--purple);
}

.primary {
  flex-shrink: 0;
  padding: 0 20px;
  border-radius: 13px;
  font-weight: 700;
  background: linear-gradient(135deg, var(--purple), var(--pink));
}

.primary:disabled {
  opacity: .5;
}

.section-title {
  font-size: 18px;
  margin: 25px 0 15px;
}

.tabs {
  display: flex;
  gap: 9px;
  overflow-x: auto;
  padding-bottom: 8px;
}

.tab {
  white-space: nowrap;
  padding: 10px 17px;
  border-radius: 30px;
  color: var(--muted);
  background: #ffffff08;
  border: 1px solid var(--border);
}

.tab.active {
  color: white;
  border-color: #a855f7;
  background: #a855f72b;
}

.track-list {
  display: grid;
  gap: 10px;
  margin-top: 14px;
}

.track {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 13px;
  background: linear-gradient(120deg, #1a1428, #12101c);
  border: 1px solid var(--border);
  border-radius: 16px;
}

.track-art {
  width: 49px;
  height: 49px;
  flex-shrink: 0;
  display: grid;
  place-items: center;
  border-radius: 13px;
  font-size: 22px;
  background: linear-gradient(135deg, #602a86, #173b54);
}

.track-info {
  flex: 1;
  min-width: 0;
}

.track-info h3 {
  font-size: 14px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.track-info p {
  font-size: 11px;
  color: var(--muted);
  margin-top: 5px;
}

.track-actions {
  display: flex;
  align-items: center;
  gap: 5px;
}

.icon-btn {
  width: 35px;
  height: 35px;
  border-radius: 11px;
  background: #ffffff0d;
  color: #d9d1ed;
  font-size: 16px;
}

.icon-btn.active {
  color: #fb7185;
}

.empty {
  text-align: center;
  color: var(--muted);
  padding: 45px 15px;
  background: #ffffff06;
  border: 1px dashed var(--border);
  border-radius: 18px;
  line-height: 2;
}

.video-area {
  display: none;
  margin-top: 22px;
  padding: 18px;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 20px;
}

.video-area.show {
  display: block;
}

.video-area h3 {
  margin-bottom: 15px;
}

.video-form {
  display: flex;
  gap: 9px;
}

video {
  width: 100%;
  margin-top: 17px;
  max-height: 420px;
  border-radius: 14px;
  background: #000;
}

.player {
  position: fixed;
  z-index: 20;
  bottom: 0;
  left: 0;
  right: 0;
  padding: 14px 18px calc(14px + env(safe-area-inset-bottom));
  background: #100c1df2;
  backdrop-filter: blur(22px);
  border-top: 1px solid var(--border);
}

.player-inner {
  max-width: 1100px;
  margin: auto;
}

.player-top {
  display: flex;
  align-items: center;
  gap: 12px;
}

.player-art {
  width: 44px;
  height: 44px;
  border-radius: 12px;
  display: grid;
  place-items: center;
  font-size: 20px;
  background: linear-gradient(135deg, var(--purple), #164e63);
}

.now-info {
  flex: 1;
  min-width: 0;
}

.now-info strong {
  display: block;
  font-size: 13px;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
}

.now-info span {
  font-size: 11px;
  color: var(--muted);
}

.player-controls {
  display: flex;
  align-items: center;
  gap: 8px;
}

.control {
  width: 34px;
  height: 34px;
  border-radius: 50%;
  background: transparent;
  font-size: 17px;
}

.control.play {
  width: 43px;
  height: 43px;
  font-size: 19px;
  background: linear-gradient(135deg, var(--purple), var(--pink));
}

.progress-row {
  display: flex;
  align-items: center;
  gap: 9px;
  margin-top: 12px;
  font-size: 10px;
  color: var(--muted);
}

input[type="range"] {
  accent-color: var(--purple);
  cursor: pointer;
}

#progress {
  flex: 1;
  min-width: 0;
}

.volume-row {
  display: flex;
  justify-content: flex-end;
  align-items: center;
  gap: 8px;
  margin-top: 7px;
  color: var(--muted);
  font-size: 12px;
}

#volume {
  width: 90px;
}

.notice {
  position: fixed;
  top: 15px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 50;
  max-width: 90%;
  padding: 12px 17px;
  border: 1px solid var(--border);
  border-radius: 12px;
  background: #241735;
  font-size: 13px;
  box-shadow: 0 8px 30px #0008;
  display: none;
}

.notice.show {
  display: block;
}

.hidden {
  display: none !important;
}

@media (max-width: 600px) {
  .app {
    padding: 17px 13px;
  }

  .hero {
    padding: 20px 16px;
  }

  .search {
    flex-direction: column;
  }

  .search .primary {
    min-height: 46px;
  }

  .track-actions {
    gap: 3px;
  }

  .icon-btn {
    width: 31px;
    height: 31px;
  }

  .player {
    padding-left: 12px;
    padding-right: 12px;
  }

  .player-controls {
    gap: 2px;
  }

  .volume-row {
    display: none;
  }
}
</style>
</head>

<body>

<div class="notice" id="notice"></div>

<main class="app">

  <header class="topbar">
    <div class="brand">
      <div class="logo">♫</div>
      <div>
        <h1>AnnieMusic</h1>
        <p>YOUR PERSONAL MUSIC SPACE</p>
      </div>
    </div>

    <div class="status">
      <span class="dot" id="statusDot"></span>
      <span id="statusText">Checking...</span>
    </div>
  </header>

  <section class="hero">
    <h2>Feel the Music <span style="color:#c084fc">♪</span></h2>
    <p>Enter a song name or YouTube URL to start listening.</p>

    <form class="search" id="searchForm">
      <input
        id="searchInput"
        type="text"
        placeholder="Song name or YouTube URL..."
        autocomplete="off"
        required
      >
      <button class="primary" id="searchButton" type="submit">
        ▶ Play
      </button>
    </form>
  </section>

  <h2 class="section-title">Your Music</h2>

  <nav class="tabs">
    <button class="tab active" data-tab="library">♫ Library</button>
    <button class="tab" data-tab="favorites">♥ Favorites</button>
    <button class="tab" data-tab="playlist">☷ Playlist</button>
    <button class="tab" data-tab="video">▣ Video</button>
  </nav>

  <section id="musicSection">
    <div class="track-list" id="trackList"></div>
  </section>

  <section class="video-area" id="videoArea">
    <h3>🎬 Video Player</h3>

    <form class="video-form" id="videoForm">
      <input
        class="video-input"
        id="videoInput"
        placeholder="YouTube URL or video query..."
        required
      >
      <button class="primary" type="submit">Load</button>
    </form>

    <video id="videoPlayer" controls playsinline preload="metadata"></video>
  </section>

</main>

<div class="player">
  <div class="player-inner">

    <div class="player-top">
      <div class="player-art">♫</div>

      <div class="now-info">
        <strong id="nowTitle">Nothing playing</strong>
        <span id="nowSubtitle">Choose a song to begin</span>
      </div>

      <div class="player-controls">
        <button class="control" id="prevBtn" title="Previous">⏮</button>
        <button class="control play" id="playBtn" title="Play">▶</button>
        <button class="control" id="nextBtn" title="Next">⏭</button>
      </div>
    </div>

    <div class="progress-row">
      <span id="currentTime">0:00</span>
      <input type="range" id="progress" min="0" max="100" value="0">
      <span id="duration">0:00</span>
    </div>

    <div class="volume-row">
      <span>🔊 Volume</span>
      <input type="range" id="volume" min="0" max="1" step="0.01" value="0.8">
    </div>

  </div>
</div>

<audio id="audioPlayer" preload="metadata"></audio>

<script>
"use strict";

// =====================================
// AnnieMusic Frontend
// =====================================

const $ = (id) => document.getElementById(id);

const audio = $("audioPlayer");
const video = $("videoPlayer");

const STORAGE_KEY = "anniemusic_v2_data";

let tracks = [];
let favorites = [];
let playlist = [];
let currentTrackId = null;
let activeTab = "library";
let noticeTimer = null;

// =====================================
// Local storage
// =====================================

function loadData() {
  try {
    const saved = JSON.parse(
      localStorage.getItem(STORAGE_KEY) || "{}"
    );

    tracks = Array.isArray(saved.tracks) ? saved.tracks : [];
    favorites = Array.isArray(saved.favorites) ? saved.favorites : [];
    playlist = Array.isArray(saved.playlist) ? saved.playlist : [];

  } catch (error) {
    console.error("Storage error:", error);
    tracks = [];
    favorites = [];
    playlist = [];
  }
}

function saveData() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      tracks,
      favorites,
      playlist
    }));
  } catch (error) {
    showNotice("Unable to save browser data.");
  }
}

// =====================================
// Utilities
// =====================================

function makeId() {
  return Date.now().toString(36) +
    Math.random().toString(36).slice(2, 8);
}

function escapeHTML(value) {
  return String(value).replace(/[&<>"']/g, char => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  })[char]);
}

function formatTime(seconds) {
  if (!Number.isFinite(seconds) || seconds < 0) {
    return "0:00";
  }

  const minutes = Math.floor(seconds / 60);
  const secs = Math.floor(seconds % 60);

  return `${minutes}:${String(secs).padStart(2, "0")}`;
}

function showNotice(message) {
  const element = $("notice");

  element.textContent = message;
  element.classList.add("show");

  clearTimeout(noticeTimer);

  noticeTimer = setTimeout(() => {
    element.classList.remove("show");
  }, 3000);
}

function getCurrentTrack() {
  return tracks.find(track => track.id === currentTrackId) || null;
}

function getStreamURL(query, type = "audio") {
  const params = new URLSearchParams({
    url: query,
    type
  });

  return `/api/music/download?${params.toString()}`;
}

// =====================================
// API status
// =====================================

async function checkAPI() {
  const dot = $("statusDot");
  const label = $("statusText");

  try {
    const response = await fetch("/api/status", {
      cache: "no-store"
    });

    const data = await response.json();

    if (!response.ok || !data.success) {
      throw new Error("API unavailable");
    }

    dot.className = "dot online";
    label.textContent = "API Online";

  } catch (error) {
    dot.className = "dot offline";
    label.textContent = "API Offline";
    console.error("API status:", error);
  }
}

// =====================================
// Track management
// =====================================

function addTrack(query) {
  const existing = tracks.find(
    track => track.query.toLowerCase() === query.toLowerCase()
  );

  if (existing) {
    return existing;
  }

  const track = {
    id: makeId(),
    title: query,
    query,
    addedAt: Date.now()
  };

  tracks.unshift(track);
  saveData();

  return track;
}

function toggleFavorite(id) {
  if (favorites.includes(id)) {
    favorites = favorites.filter(item => item !== id);
    showNotice("Removed from Favorites");
  } else {
    favorites.push(id);
    showNotice("Added to Favorites ♥");
  }

  saveData();
  renderList();
}

function togglePlaylist(id) {
  if (playlist.includes(id)) {
    playlist = playlist.filter(item => item !== id);
    showNotice("Removed from Playlist");
  } else {
    playlist.push(id);
    showNotice("Added to Playlist");
  }

  saveData();
  renderList();
}

// =====================================
// Render library
// =====================================

function getVisibleTracks() {
  if (activeTab === "favorites") {
    return tracks.filter(track => favorites.includes(track.id));
  }

  if (activeTab === "playlist") {
    return tracks.filter(track => playlist.includes(track.id));
  }

  return tracks;
}

function renderList() {
  const list = $("trackList");
  const visible = getVisibleTracks();

  if (activeTab === "video") {
    $("musicSection").classList.add("hidden");
    $("videoArea").classList.add("show");
    return;
  }

  $("musicSection").classList.remove("hidden");
  $("videoArea").classList.remove("show");

  if (!visible.length) {
    list.innerHTML = `
      <div class="empty">
        <div style="font-size:35px">♫</div>
        <strong>No music here yet</strong>
        <div>Enter a song name above to start.</div>
      </div>
    `;
    return;
  }

  list.innerHTML = visible.map(track => {
    const isFavorite = favorites.includes(track.id);
    const isInPlaylist = playlist.includes(track.id);
    const isPlaying = currentTrackId === track.id;

    return `
      <article class="track">
        <div class="track-art">${isPlaying ? "🎵" : "♫"}</div>

        <div class="track-info">
          <h3>${escapeHTML(track.title)}</h3>
          <p>${isPlaying ? "NOW PLAYING" : "AnnieMusic Library"}</p>
        </div>

        <div class="track-actions">
          <button
            class="icon-btn ${isFavorite ? "active" : ""}"
            onclick="toggleFavorite('${track.id}')"
            title="Favorite"
          >♥</button>

          <button
            class="icon-btn ${isInPlaylist ? "active" : ""}"
            onclick="togglePlaylist('${track.id}')"
            title="Playlist"
          >☷</button>

          <button
            class="icon-btn"
            onclick="playById('${track.id}')"
            title="Play"
          >▶</button>
        </div>
      </article>
    `;
  }).join("");
}

// =====================================
// Playback
// =====================================

async function playTrack(id) {
  const track = tracks.find(item => item.id === id);

  if (!track) {
    showNotice("Track not found");
    return;
  }

  currentTrackId = id;

  video.pause();

  $("nowTitle").textContent = track.title;
  $("nowSubtitle").textContent = "AnnieMusic Streaming";
  $("playBtn").textContent = "Ⅱ";

  audio.src = getStreamURL(track.query, "audio");
  audio.load();

  renderList();

  try {
    await audio.play();
  } catch (error) {
    console.error("Playback error:", error);
    $("playBtn").textContent = "▶";
    showNotice("Playback failed. Check API or media format.");
  }
}

function playById(id) {
  playTrack(id);
}

function togglePlay() {
  if (!audio.src) {
    showNotice("Choose a song first");
    return;
  }

  if (audio.paused) {
    audio.play().catch(error => {
      console.error(error);
      showNotice("Unable to play audio");
    });
  } else {
    audio.pause();
  }
}

function playNext() {
  const list = activeTab === "playlist"
    ? getVisibleTracks()
    : tracks;

  if (!list.length) {
    showNotice("No next song");
    return;
  }

  const index = list.findIndex(
    track => track.id === currentTrackId
  );

  const next = list[(index + 1 + list.length) % list.length];

  playTrack(next.id);
}

function playPrevious() {
  const list = activeTab === "playlist"
    ? getVisibleTracks()
    : tracks;

  if (!list.length) {
    showNotice("No previous song");
    return;
  }

  const index = list.findIndex(
    track => track.id === currentTrackId
  );

  const previous = list[
    (index <= 0 ? list.length - 1 : index - 1)
  ];

  playTrack(previous.id);
}

// =====================================
// Search / play
// =====================================

$("searchForm").addEventListener("submit", async event => {
  event.preventDefault();

  const input = $("searchInput");
  const button = $("searchButton");
  const query = input.value.trim();

  if (!query) {
    showNotice("Enter a song name or URL");
    return;
  }

  button.disabled = true;
  button.textContent = "Loading...";

  try {
    const response = await fetch("/api/status");

    if (!response.ok) {
      throw new Error("Backend unavailable");
    }

    const status = await response.json();

    if (!status.success) {
      throw new Error("Annie API unavailable");
    }

    const track = addTrack(query);

    activeTab = "library";
    updateTabs();
    renderList();

    await playTrack(track.id);

    input.value = "";

  } catch (error) {
    console.error(error);
    showNotice(error.message || "Search failed");
  } finally {
    button.disabled = false;
    button.textContent = "▶ Play";
  }
});

// =====================================
// Tabs
// =====================================

function updateTabs() {
  document.querySelectorAll(".tab").forEach(button => {
    button.classList.toggle(
      "active",
      button.dataset.tab === activeTab
    );
  });
}

document.querySelectorAll(".tab").forEach(button => {
  button.addEventListener("click", () => {
    activeTab = button.dataset.tab;
    updateTabs();
    renderList();
  });
});

// =====================================
// Video
// =====================================

$("videoForm").addEventListener("submit", async event => {
  event.preventDefault();

  const query = $("videoInput").value.trim();

  if (!query) {
    showNotice("Enter a video URL or query");
    return;
  }

  audio.pause();

  video.src = getStreamURL(query, "video");
  video.load();

  try {
    await video.play();
    showNotice("Video started");
  } catch (error) {
    console.error("Video error:", error);
    showNotice("Video could not start. Check the video URL.");
  }
});

video.addEventListener("error", () => {
  showNotice("Video playback error");
});

// =====================================
// Player controls
// =====================================

$("playBtn").addEventListener("click", togglePlay);
$("nextBtn").addEventListener("click", playNext);
$("prevBtn").addEventListener("click", playPrevious);

audio.addEventListener("play", () => {
  $("playBtn").textContent = "Ⅱ";
});

audio.addEventListener("pause", () => {
  $("playBtn").textContent = "▶";
});

audio.addEventListener("ended", playNext);

audio.addEventListener("timeupdate", () => {
  $("currentTime").textContent = formatTime(audio.currentTime);

  if (Number.isFinite(audio.duration) && audio.duration > 0) {
    $("duration").textContent = formatTime(audio.duration);

    $("progress").value =
      (audio.currentTime / audio.duration) * 100;
  }
});

audio.addEventListener("loadedmetadata", () => {
  $("duration").textContent = formatTime(audio.duration);
});

audio.addEventListener("error", () => {
  $("playBtn").textContent = "▶";

  const code = audio.error ? audio.error.code : 0;

  console.error("Audio error code:", code);

  showNotice(
    "Audio error. Check API response and media format."
  );
});

$("progress").addEventListener("input", event => {
  if (Number.isFinite(audio.duration) && audio.duration > 0) {
    audio.currentTime =
      (Number(event.target.value) / 100) * audio.duration;
  }
});

$("volume").addEventListener("input", event => {
  audio.volume = Number(event.target.value);
});

audio.volume = 0.8;

// =====================================
// Initial setup
// =====================================

loadData();
renderList();
checkAPI();

setInterval(checkAPI, 60000);
</script>

</body>
</html>
